name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version
        required: true
        type: string
      publish:
        description: Publish this verified main commit to npm and GitHub
        type: boolean
        default: false

concurrency:
  group: boundra-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish == true }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an exact semantic version"
            exit 1
          fi
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication requires main"
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi

  verify-full:
    needs: preflight
    uses: ./.github/workflows/boundra.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      full_verify: true

  validate:
    needs: verify-full
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-release-notes "${RELEASE_VERSION}"
      - run: pnpm check-release-version "${RELEASE_VERSION}"
      - name: Verify legacy CLI download through repository redirect
        shell: bash
        run: |
          legacy_dir="$(mktemp -d "$RUNNER_TEMP/boundra-legacy-XXXXXX")"
          npm pack boundra@0.6.0 --ignore-scripts --pack-destination "$legacy_dir"
          tar -xzf "$legacy_dir/boundra-0.6.0.tgz" -C "$legacy_dir"
          BOUNDRA_CACHE_DIR="$legacy_dir/cache" node "$legacy_dir/package/bin/boundra.mjs" --version | grep -F '0.6.0'

  build-cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p boundra-cli --target ${{ matrix.target }}
      - name: Archive Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          name="boundra-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/boundra" "dist/${name}/"
          cp LICENSE "dist/${name}/"
          cp docs/cli-install.md "dist/${name}/README.md"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
      - name: Archive Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $name = "boundra-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name"
          Copy-Item "target/${{ matrix.target }}/release/boundra.exe" "dist/$name/"
          Copy-Item LICENSE "dist/$name/"
          Copy-Item docs/cli-install.md "dist/$name/README.md"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-package:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p dist
      - run: pnpm --filter boundra pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  prepare-tag:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main')
    needs: [build-cli, build-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify or create immutable release tag
        shell: bash
        run: |
          tag="v${RELEASE_VERSION#v}"
          commit="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$commit" ]]; then
              echo "::error::Release tag already points to a different commit"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git tag "$tag" "$commit"
            git push origin "refs/tags/$tag"
          else
            echo "::error::Expected release tag is missing"
            exit 1
          fi

  publish-package:
    needs: [build-cli, build-package, prepare-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: npm publish --access public
        working-directory: packages/runtime

  publish-release:
    needs: [build-cli, build-package, publish-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums-sha256.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          tag="v${version}"
          notes_file="docs/releases/v${version//./-}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Boundra $tag" \
              --notes-file "$notes_file"
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --verify-tag \
              --title "Boundra $tag" \
              --notes-file "$notes_file"
          fi
