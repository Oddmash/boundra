name: Deploy Pages

on:
  pull_request:
    branches: [develop, main]
    paths: ['site/**', 'docs/**', 'examples/order-billing/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'examples/order-billing/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm run build
        working-directory: site
      - name: Validate landing assets
        run: python3 site/scripts/validate.py
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: site
      - run: pnpm exec playwright test
        working-directory: site
      - name: Upload responsive verification captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser-results
          path: site/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload static website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
