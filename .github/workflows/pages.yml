name: Landing page

on:
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Validate landing assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      assert attrs['id'] not in self.ids, 'duplicate id'
                      self.ids.add(attrs['id'])
                  self.links.extend(attrs[key] for key in ('href', 'src') if key in attrs)
          root = Path('site/dist')
          parser = Links()
          parser.feed((root / 'index.html').read_text())
          for link in parser.links:
              parsed = urlsplit(link)
              if not parsed.scheme and not parsed.netloc:
                  if parsed.path:
                      path = parsed.path
                      if path.startswith('/boundra/'):
                          path = path.removeprefix('/boundra/')
                      assert (root / path).exists(), link
                  if parsed.fragment:
                      assert parsed.fragment in parser.ids, link
          PY
      - name: Upload static website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
