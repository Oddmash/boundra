name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@9a2077a4b0ff9188ef2cb2ab306f181a134d3110
    with:
      profile: agents
  verify-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: boundra-cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-release-notes
      - run: pnpm verify-example
      - run: pnpm verify-clean-room
      - run: node scripts/verify-framework-consumers.mjs
      - run: cargo clippy --workspace --all-targets -- -D warnings

  verify-runtime:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node node_modules/typescript/bin/tsc -p packages/runtime/tsconfig.build.json
      - run: node --import tsx packages/runtime/tests/runtime-test.ts

  verify-cli-platforms:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: boundra-cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo test --workspace
      - run: cargo build --release -p boundra-cli
      - run: ./target/release/boundra --version
      - run: node packages/runtime/bin/boundra.mjs --version
        env:
          BOUNDRA_CLI_PATH: ${{ runner.os == 'Windows' && format('{0}\\target\\release\\boundra.exe', github.workspace) || format('{0}/target/release/boundra', github.workspace) }}

  benchmark-smoke:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: boundra-cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo build --release -p boundra-cli
      - run: node scripts/benchmark-boundaries.mjs --files 1000 --iterations 2 --max-ms 5000 --max-rss-mb 512
      - run: node scripts/benchmark-boundaries.mjs --files 10000 --iterations 3

  verify:
    if: ${{ always() }}
    needs: [scope, verify-example, verify-runtime, verify-cli-platforms, benchmark-smoke]
    runs-on: ubuntu-slim
    steps:
      - name: Require all applicable Boundra checks
        env:
          SCOPE: ${{ needs.scope.result }}
          EXAMPLE: ${{ needs.verify-example.result }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
          RESULTS: ${{ needs.verify-runtime.result }} ${{ needs.verify-cli-platforms.result }} ${{ needs.benchmark-smoke.result }}
        run: |
          test "$SCOPE:$EXAMPLE" = success:success
          for result in $RESULTS; do
            case "$RUNTIME:$result" in true:success|false:skipped) ;; *) exit 1 ;; esac
          done
