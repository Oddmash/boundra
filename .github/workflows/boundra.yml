name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      full_verify:
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contribution:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@ci-v1
    with:
      profile: meta

  scope:
    runs-on: ubuntu-slim
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
      cli: ${{ steps.classify.outputs.cli }}
      integration: ${{ steps.classify.outputs.integration }}
      notes: ${{ steps.classify.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test scope decisions
        run: node --test scripts/classify-ci-scope.test.mjs
      - name: Classify Boundra changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FULL_VERIFY: ${{ inputs.full_verify == true }}
        run: node scripts/classify-ci-scope.mjs

  release-notes:
    needs: scope
    if: needs.scope.outputs.notes == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/check-release-notes.mjs

  verify-example:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: boundra-cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify-example
      - run: pnpm verify-clean-room
      - run: node scripts/verify-framework-consumers.mjs
      - run: cargo clippy --workspace --all-targets -- -D warnings

  verify-runtime:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node node_modules/typescript/bin/tsc -p packages/runtime/tsconfig.build.json
      - run: node --import tsx packages/runtime/tests/runtime-test.ts
      - run: node --import tsx --test packages/runtime/tests/eslint-test.mjs
      - name: Verify ESLint flat config compatibility
        if: matrix.node-version == 24
        run: |
          npm install --prefix "$RUNNER_TEMP/eslint-nine" --ignore-scripts --no-audit --no-fund eslint@9.39.5
          BOUNDRA_ESLINT_PACKAGE="$RUNNER_TEMP/eslint-nine" node --import tsx --test packages/runtime/tests/eslint-test.mjs
          npm install --prefix "$RUNNER_TEMP/eslint-ten" --ignore-scripts --no-audit --no-fund eslint@10.14.0
          BOUNDRA_ESLINT_PACKAGE="$RUNNER_TEMP/eslint-ten" node --import tsx --test packages/runtime/tests/eslint-test.mjs

  verify-cli-platforms:
    needs: scope
    if: needs.scope.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: boundra-cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo test --workspace
      - run: cargo build --release -p boundra-cli
      - run: ./target/release/boundra --version
      - run: node packages/runtime/bin/boundra.mjs --version
        env:
          BOUNDRA_CLI_PATH: ${{ runner.os == 'Windows' && format('{0}\\target\\release\\boundra.exe', github.workspace) || format('{0}/target/release/boundra', github.workspace) }}

  benchmark-smoke:
    needs: scope
    if: needs.scope.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: boundra-cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo build --release -p boundra-cli
      - run: node scripts/benchmark-boundaries.mjs --files 1000 --iterations 2 --max-ms 5000 --max-rss-mb 512
      - run: node scripts/benchmark-boundaries.mjs --files 10000 --iterations 3

  verify:
    if: ${{ always() }}
    needs: [contribution, scope, release-notes, verify-example, verify-runtime, verify-cli-platforms, benchmark-smoke]
    runs-on: ubuntu-slim
    steps:
      - name: Require all applicable Boundra checks
        env:
          CONTRIBUTION: ${{ needs.contribution.result }}
          SCOPE: ${{ needs.scope.result }}
          NOTES: ${{ needs.scope.outputs.notes }}:${{ needs.release-notes.result }}
          INTEGRATION: ${{ needs.scope.outputs.integration }}:${{ needs.verify-example.result }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}:${{ needs.verify-runtime.result }}
          CLI: ${{ needs.scope.outputs.cli }}:${{ needs.verify-cli-platforms.result }}
          BENCHMARK: ${{ needs.scope.outputs.cli }}:${{ needs.benchmark-smoke.result }}
        run: |
          test "$CONTRIBUTION:$SCOPE" = success:success
          for result in "$NOTES" "$INTEGRATION" "$RUNTIME" "$CLI" "$BENCHMARK"; do
            case "$result" in true:success|false:skipped) ;; *) exit 1 ;; esac
          done
